<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3026">
<title>NAHAL · Reservar turno</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#4a3026;--deep:#2b2421;--card:#5a3b2f;--card2:#724330;--cream:#f4f0e8;--gold:#b99a6b;--mute:#c9bba8;--line:rgba(185,154,107,.35);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 'DM Sans',system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 18px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header svg{width:52px;height:52px;flex:none}
.brand{font-family:'DM Serif Display',Georgia,serif;font-size:1.55rem;letter-spacing:.28em;line-height:1}
header small{display:block;color:var(--gold);letter-spacing:.3em;font-size:.75rem;margin-top:5px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:2rem;line-height:1.1;margin:0 0 6px}
h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.25rem;margin:24px 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.gal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 22px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:90px 90px 14px 14px;border:1px solid var(--gold);padding:4px;background:var(--deep);display:block}
.gal p{grid-column:1/-1;margin:2px 0 0;color:var(--gold);font-size:.85rem;text-align:center}
.back{background:#000;border:1.5px solid var(--cream);color:var(--cream);font:600 1.15rem 'DM Sans',sans-serif;padding:8px 18px;min-height:44px;border-radius:999px;margin-bottom:16px;cursor:pointer}
.crumb{color:var(--gold);font-size:1rem;margin:0 0 6px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.opt b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.15rem;display:block}
.opt span.d{display:block;color:var(--mute);font-size:1rem}
.opt .pr{color:var(--gold);font-weight:600;white-space:nowrap}
.opt.arrow:after{content:"›";color:var(--gold);font-size:1.5rem;line-height:1}
.opt:hover{background:var(--card2)}
.opt[aria-pressed=true]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.opt[aria-pressed=true] .pr,.opt[aria-pressed=true] span.d{color:var(--deep)}
.pro{align-items:flex-start;flex-direction:column;gap:8px}
.pro .av{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none}
.pro .row{display:flex;gap:12px;align-items:center}
.pro a{color:var(--gold);font-size:1rem}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 auto;width:62px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;text-align:center;cursor:pointer}
.day small{display:block;color:var(--mute)}
.day strong{font-size:1.25rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;cursor:pointer}
.day[aria-pressed=true],.slot[aria-pressed=true]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.day[aria-pressed=true] small{color:var(--deep)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
input,textarea{width:100%;font:inherit;color:var(--cream);background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cta{width:100%;margin-top:10px;padding:15px;border:0;border-radius:999px;background:var(--gold);color:var(--deep);font:600 1rem 'DM Sans',sans-serif;display:block;text-align:center;text-decoration:none;cursor:pointer}
.cta.ghost{background:none;border:1px solid var(--gold);color:var(--gold)}
.sum{background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:16px;margin:8px 0 14px}
.sum p{margin:4px 0}
.tot{display:flex;justify-content:space-between;font-weight:600;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hint{color:var(--mute);font-size:1rem}
.err{color:#ffb4a0;font-size:1rem;min-height:1.2em;margin:0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay .opt{justify-content:center;text-align:center}
.alias{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--deep);border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;margin:10px 0}
.alias button{background:var(--gold);color:var(--deep);border:0;border-radius:999px;padding:6px 14px;font:600 1rem 'DM Sans',sans-serif;cursor:pointer}
header{margin-bottom:12px}
.tabs{display:flex;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 12px;margin-bottom:10px}
.tabs button{flex:1;padding:13px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--cream);font:600 1.05rem 'DM Sans',sans-serif;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.wanote{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:14px 16px;margin:0 0 18px;font-size:1.1rem;line-height:1.4}
.wanote .cta{margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card p{margin:4px 0}.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:600;font-size:1rem;background:var(--gold);color:var(--deep)}
.badge.x{background:#7a2e2e;color:var(--cream)}
.code{font:600 1.6rem 'DM Sans',sans-serif;letter-spacing:.15em;color:var(--gold)}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.car img{flex:0 0 86%;width:86%;scroll-snap-align:center;border-radius:20px;border:1px solid var(--gold);aspect-ratio:4/5;object-fit:cover;cursor:zoom-in;background:var(--deep)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:50;display:none;flex-direction:column}
.lb .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;font-size:1.05rem}
.lb .st{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
.lb .st img{max-width:100%;max-height:100%;object-fit:contain}
.lb .st.z{align-items:flex-start;justify-content:flex-start}.lb .st.z img{max-width:none;max-height:none;width:230%}
.lb .nav{display:flex;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.lb .nav .cta{margin:0;flex:1}
#prev{max-width:100%;max-height:220px;border-radius:12px;margin-top:8px;display:none}
</style>
</head>

<script type="module">
try {
  var A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  var F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  var db = F.getFirestore(A.initializeApp(window.FIREBASE_CONFIG));
  var slotId = function(d,p,t){return d+"_"+p+"_"+t};
  window.DB = {
    busy: async function(date, pro){
      var q = F.query(F.collection(db,"ocupados"), F.where("date","==",date), F.where("pro","==",pro));
      return (await F.getDocs(q)).docs.map(function(d){return d.data()});
    },
    book: async function(b){
      var id = slotId(b.date,b.pro,b.time), w = F.writeBatch(db);
      w.set(F.doc(db,"ocupados",id), {date:b.date, pro:b.pro, time:b.time});
      w.set(F.doc(db,"punteros",id), {code:b.code});
      w.set(F.doc(db,"reservas_x7k2q9",b.code), {codigo:b.code, date:b.date, time:b.time, pro:b.pro, inicio:F.Timestamp.fromDate(b.inicio),
        servicios:b.servicios, total:b.total, sena:b.sena, resto:b.resto, cliente:b.cliente, telefono:b.telefono,
        aclaraciones:b.aclaraciones, comprobante:b.comprobante, estado:"activo", creado:F.serverTimestamp()});
      await w.commit();
    },
    get: async function(code){
      var s = await F.getDoc(F.doc(db,"reservas_x7k2q9",code));
      if(!s.exists()) return null;
      var d = s.data(); d.inicio = d.inicio.toMillis(); return d;
    },
    cancel: async function(t){
      var w = F.writeBatch(db);
      w.update(F.doc(db,"reservas_x7k2q9",t.codigo), {estado:"cancelado"});
      w.delete(F.doc(db,"ocupados",slotId(t.date,t.pro,t.time)));
      await w.commit();
    }
  };
} catch(e) { console.error("Firebase no se pudo iniciar", e); }
window.DB_READY = true;
</script>

var S = {view:"book", path:[], step:"tree", sel:[], pro:null, date:null, time:null, pay:null, file:null};
var $app = document.getElementById("app");
var DAYN = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MONTHN = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function $(i){return document.getElementById(i)}
function money(n){return "$"+n.toLocaleString("es-AR")}
function load(){try{return JSON.parse(localStorage.getItem("nahal_ocupados")||"[]")}catch(e){return []}}
function save(l){try{localStorage.setItem("nahal_ocupados",JSON.stringify(l))}catch(e){}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pretty(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return DAYN[d.getDay()]+" "+d.getDate()+" de "+MONTHN[d.getMonth()]}
function node(){return S.path.length?S.path[S.path.length-1].n:TREE}
function items(){return S.sel}
function total(){return S.sel.reduce(function(a,o){return a+(o.p||0)},0)}
function minutes(){return S.sel.reduce(function(a,o){return a+(o.m||30)},0)}
function facial(){return S.sel.some(function(o){return o.f})}
function names(){return S.sel.map(function(o){return o.l}).join(", ")}
function el(h){var d=document.createElement("div");d.innerHTML=h;return d}
function priceTxt(o){return o.p==null?"Consultar":money(o.p)}
function go(step){S.step=step;render();window.scrollTo(0,0)}
function back(){
  if(S.step==="tree"&&S.path.length)S.path.pop();
  else if(S.step==="pro"){S.step="tree";if(!S.path[S.path.length-1].n)S.path.pop();S.sel=[]}
  else if(S.step==="when"){S.step="pro";S.time=null}
  else if(S.step==="final")S.step="when";
  render();window.scrollTo(0,0);
}
function backBtn(){return S.step==="tree"&&!S.path.length?"":'<button class="back" id="bk">‹ Volver</button>'}
function crumb(){return S.path.map(function(o){return o.l}).join(" › ")}

function renderBook(){
  $app.innerHTML="";
  if(S.step==="tree"){
    var nd=node(),first=!S.path.length;
    var g="";
    if(first)g='<div class="gal">'+IMGS.map(function(s){return '<img alt="Trabajo de uñas realizado en NAHAL" src="'+s+'">'}).join("")+'<p>Algunos de nuestros trabajos</p></div>';
    $app.appendChild(el(g+backBtn()+(first?'':'<p class="crumb">'+crumb()+'</p>')+'<h1>'+nd.t+'</h1>'+(first?'<p class="sub">Elegí tu servicio y reservá en pocos pasos.</p>':nd.multi?'<p class="sub">Podés elegir varias opciones.</p>':'<p class="sub"></p>')+'<div class="opts" id="opts"></div>'+(nd.multi?'<div class="sum" id="tot" style="margin-top:14px"></div><p class="err" id="err" role="alert"></p><button class="cta" id="nx">Continuar</button>':'')));
    nd.o.forEach(function(o){
      var b=document.createElement("button");b.className="opt"+(o.n?" arrow":"");
      b.innerHTML='<div><b></b><span class="d"></span></div>'+(o.p!==undefined?'<span class="pr"></span>':'');
      b.querySelector("b").textContent=o.l;b.querySelector(".d").textContent=o.d||"";if(!o.d)b.querySelector(".d").remove();
      if(o.p!==undefined)b.querySelector(".pr").textContent=priceTxt(o);
      if(nd.multi){
        b.setAttribute("aria-pressed",S.sel.indexOf(o)>=0);
        b.onclick=function(){
          var i=S.sel.indexOf(o);
          if(i>=0)S.sel.splice(i,1);else{S.sel=S.sel.filter(function(s){return !(o.x&&s.x===o.x)});S.sel.push(o)}
          render();
        };
      }else b.onclick=function(){
        S.path.push(o);
        if(!o.n){S.sel=[o];go("pro")}else{S.sel=[];render();window.scrollTo(0,0)}
      };
      $("opts").appendChild(b);
    });
    if(first){
      var gs=el('<h2>Más de nuestros trabajos</h2><p class="hint">Deslizá para ver más. Tocá una foto para verla más grande.</p><div class="car" id="car"></div>');
      $app.appendChild(gs);
      GAL.forEach(function(src,i){var im=new Image();im.src=src;im.alt="Trabajo realizado en NAHAL";im.onclick=function(){lbOpen(i)};$("car").appendChild(im)});
    }
    if(nd.multi){
      $("tot").innerHTML=S.sel.length?'<div>'+S.sel.map(function(o){return o.l}).join(", ")+'</div><div class="tot"><span>Total</span><span>'+money(total())+'</span></div>':'<span class="hint">Todavía no elegiste ninguna zona.</span>';
      $("nx").onclick=function(){if(!S.sel.length)return $("err").textContent="Elegí al menos una opción.";go("pro")};
    }
  }else if(S.step==="pro"){
    $app.appendChild(el(backBtn()+'<p class="crumb">'+crumb()+(S.sel.length&&!S.path[S.path.length-1].n&&S.sel[0]!==S.path[S.path.length-1]?'':'')+'</p><h1>¿Con quién querés atenderte?</h1><p class="sub">'+(facial()?'Este servicio lo realiza solo Celeste.':'Elegí la profesional. Podés ver su perfil.')+'</p><div class="opts" id="opts"></div>'));
    PROS.forEach(function(p){
      if(facial()&&p.noFacial)return;
      var b=document.createElement("div");b.className="opt pro";b.tabIndex=0;b.setAttribute("role","button");
      b.innerHTML='<div class="row"><img class="av" alt=""><div><b></b><span class="d"></span></div></div><a target="_blank" rel="noopener">Ver perfil en Instagram</a>';
      var im=b.querySelector(".av");im.src=p.img;im.alt="Foto de perfil de "+p.n;b.querySelector("b").textContent=p.n;b.querySelector(".d").textContent="@"+p.ig;
      var a=b.querySelector("a");a.href=p.url;a.onclick=function(e){e.stopPropagation()};
      var pick=function(){S.pro=p;S.date=null;S.time=null;go("when")};
      b.onclick=pick;b.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}};
      $("opts").appendChild(b);
    });
  }else if(S.step==="when"){
    $app.appendChild(el(backBtn()+'<p class="crumb">'+names()+' · '+S.pro.n+'</p><h1>Elegí día y horario</h1><p class="sub">Podés reservar hasta '+MAXDAYS+' días antes.</p><div class="wanote"><b>¿No podés en estos turnos?</b><br>Coordiná tu turno por WhatsApp con '+S.pro.n+'.<a class="cta" id="wa2" target="_blank" rel="noopener">Hablar por WhatsApp</a></div><div class="days" id="days"></div><h2>Horario</h2><div class="slots" id="slots"></div><p class="hint" id="sh"></p><p class="err" id="err" role="alert"></p><button class="cta" id="nx">Continuar</button>'));
    drawDays();drawSlots();
    $("wa2").href="https://wa.me/"+S.pro.wa+"?text="+encodeURIComponent("Hola! No puedo en los turnos disponibles. Quiero coordinar un turno de: "+names());
    $("nx").onclick=function(){if(!S.date||!S.time)return $("err").textContent="Elegí un día y un horario.";go("final")};
  }else if(S.step==="final"){
    var se=sena(),re=total()-se;
    $app.appendChild(el(backBtn()+'<h1>Confirmá tu turno</h1><div class="sum">'+S.sel.map(function(o){return '<p>'+o.l+' <span style="float:right;color:var(--gold)">'+priceTxt(o)+'</span></p>'}).join("")+'<p class="hint">'+S.pro.n+' · '+pretty(S.date)+' · '+S.time+' hs</p><div class="tot"><span>Total</span><span>'+money(total())+'</span></div></div>'+
    '<h2>Tus datos</h2><input id="name" placeholder="Nombre y apellido" autocomplete="name"><input id="tel" placeholder="Tu WhatsApp (con código de área)" type="tel" autocomplete="tel"><textarea id="note" placeholder="¿Querés aclarar algo del turno? (opcional)"></textarea>'+
    '<h2>Seña para reservar</h2><div class="sum"><p>Para reservar el turno hay que abonar el <b>50%</b>:</p><p class="code" style="letter-spacing:0">'+money(se)+'</p><p>El otro 50% ('+money(re)+') lo abonás en el local.</p></div>'+
    '<p class="hint">Transferí la seña al alias de Mercado Pago y subí la foto del comprobante.</p><div class="alias"><b>'+ALIAS+'</b><button id="cp">Copiar</button></div><input type="file" id="file" accept="image/*"><img id="prev" alt="Comprobante">'+
    '<p class="err" id="err" role="alert"></p><button class="cta" id="go">Reservar turno</button>'));
    $("cp").onclick=function(){try{navigator.clipboard.writeText(ALIAS);$("cp").textContent="Copiado"}catch(e){$("cp").textContent=ALIAS}};
    $("file").onchange=function(){S.file=this.files[0]||null;if(S.file){$("prev").src=URL.createObjectURL(S.file);$("prev").style.display="block"}};
    $("go").onclick=confirmar;
  }else{
    $app.appendChild(el('<h1>¡Turno reservado!</h1><p class="sub">Guardá tu código. Lo necesitás para ver o cancelar tu turno desde otro celular.</p><div class="sum"><p class="code">'+S.code+'</p><p><b>'+names()+'</b></p><p>'+S.pro.n+' · '+pretty(S.date)+' · '+S.time+' hs</p><div class="tot"><span>Total</span><span>'+money(total())+'</span></div><p class="hint">Seña abonada: '+money(sena())+' · Resto en el local: '+money(total()-sena())+'</p></div><a class="cta" id="wa" target="_blank" rel="noopener">Avisar a '+S.pro.n+' por WhatsApp</a><button class="cta ghost" id="mine">Ver mis turnos</button><button class="back" id="again" style="margin-top:18px">Reservar otro turno</button>'));
    $("wa").href="https://wa.me/"+S.pro.wa+"?text="+encodeURIComponent(S.msg);
    $("mine").onclick=function(){S.view="mine";render();window.scrollTo(0,0)};
    $("again").onclick=function(){S={view:"book",path:[],step:"tree",sel:[],pro:null,date:null,time:null,pay:null,file:null};render()};
  }
  var bk=$("bk");if(bk)bk.onclick=back;
}
function sena(){return Math.round(total()/2)}
function drawDays(){
  var box=$("days"),d=new Date(),n=0;
  for(var i=0;i<=MAXDAYS;i++){
    if(HOURS[d.getDay()]){(function(dd){
      var k=iso(dd),b=document.createElement("button");b.className="day";b.setAttribute("aria-pressed",S.date===k);
      b.innerHTML='<small>'+DAYN[dd.getDay()].slice(0,3)+'</small><strong>'+dd.getDate()+'</strong><small>'+MONTHN[dd.getMonth()].slice(0,3)+'</small>';
      b.onclick=function(){S.date=k;S.time=null;S.busy=null;drawDays();drawSlots();loadBusy(k)};box.appendChild(b)})(new Date(d))}
    d.setDate(d.getDate()+1);
  }
  var sel=box.querySelector("[aria-pressed=true]");
}
function drawDaysKeep(){var s=$("days").scrollLeft;$("days").innerHTML="";drawDays();$("days").scrollLeft=s}
function drawSlots(){
  var box=$("slots"),hint=$("sh");box.innerHTML="";
  if(!S.date){hint.textContent="Elegí un día para ver los horarios.";return}
  var p=S.date.split("-"),dow=new Date(+p[0],+p[1]-1,+p[2]).getDay(),hs=HOURS[dow]||[];
  if(S.busy===null||S.busy===undefined){hint.textContent="Cargando horarios…";return}
  var taken=S.busy;
  var now=new Date(),isToday=S.date===iso(now),any=false;
  hs.forEach(function(h){
    var t=String(h).padStart(2,"0")+":00";
    var busy=taken.some(function(x){return x.time===t}),past=isToday&&h*60<=now.getHours()*60+now.getMinutes();
    var b=document.createElement("button");b.className="slot";b.textContent=t+" hs";b.disabled=busy||past;if(!b.disabled)any=true;
    b.setAttribute("aria-pressed",S.time===t);
    b.onclick=function(){S.time=t;drawSlots()};box.appendChild(b);
  });
  hint.textContent=any?"":"No quedan horarios ese día. Probá con otro.";
}
// evitar que el scroll de días se reinicie
var _dd=drawDays;drawDays=function(){var c=$("days"),s=c.scrollLeft;c.innerHTML="";_dd();c.scrollLeft=s};
function loadBusy(k){
  var go2=function(){window.DB.busy(k,S.pro.n).then(function(r){if(S.date===k){S.busy=r;drawSlots()}}).catch(function(){if(S.date===k){S.busy=[];drawSlots()}})};
  if(window.DB_READY)go2();else setTimeout(function(){loadBusy(k)},300);
}
function ready(f){if(window.DB_READY)f();else setTimeout(function(){ready(f)},250)}
function compress(f){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var r=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.6))};im.onerror=rej;im.src=URL.createObjectURL(f)})}
function makeCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=new Uint8Array(10);crypto.getRandomValues(r);return Array.prototype.map.call(r,function(x){return a[x%a.length]}).join("")}
function getCodes(){try{return JSON.parse(localStorage.getItem("nahal_codes")||"[]")}catch(e){return []}}
function saveCode(c){var l=getCodes();if(l.indexOf(c)<0){l.unshift(c);try{localStorage.setItem("nahal_codes",JSON.stringify(l))}catch(e){}}}
function confirmar(){
  var name=$("name").value.trim(),tel=$("tel").value.trim(),note=$("note").value.trim(),err=$("err");
  if(name.length<2)return err.textContent="Escribí tu nombre.";
  if(tel.replace(/\D/g,"").length<8)return err.textContent="Escribí tu WhatsApp con código de área.";
  if(!S.file)return err.textContent="Subí la foto del comprobante de la seña.";
  var btn=$("go");btn.disabled=true;btn.textContent="Reservando…";err.textContent="";
  var p=S.date.split("-"),code=makeCode();
  compress(S.file).then(function(img){
    return window.DB.book({code:code,date:S.date,time:S.time,pro:S.pro.n,inicio:new Date(+p[0],+p[1]-1,+p[2],+S.time.slice(0,2),0),
      servicios:names(),total:total(),sena:sena(),resto:total()-sena(),cliente:name,telefono:tel,aclaraciones:note,comprobante:img});
  }).then(function(){
    saveCode(code);S.code=code;
    S.msg="*NUEVO TURNO · NAHAL*\n\n*Servicio:* "+names()+"\n*Profesional:* "+S.pro.n+"\n*Fecha:* "+pretty(S.date)+"\n*Horario:* "+S.time+" hs\n*Total:* "+money(total())+"\n*Seña 50% (transferencia, comprobante cargado):* "+money(sena())+"\n*Resto a abonar en el local:* "+money(total()-sena())+"\n\n*Cliente:* "+name+"\n*WhatsApp:* "+tel+(note?"\n*Aclaraciones:* "+note:"")+"\n*Código:* "+code;
    go("done");
  }).catch(function(){
    S.busy=null;S.time=null;go("when");loadBusy(S.date);
    setTimeout(function(){var e=$("err");if(e)e.textContent="No se pudo reservar. Puede que ese horario se haya ocupado: elegí otro."},50);
  });
}
function renderMine(){
  $app.innerHTML="";
  $app.appendChild(el('<h1>Mis turnos</h1><p class="sub">Acá ves tus turnos y podés cancelarlos hasta 1 día antes.</p><div id="list"></div><h2>¿Reservaste desde otro celular?</h2><input id="code" placeholder="Tu código de turno" autocapitalize="characters"><p class="err" id="err" role="alert"></p><button class="cta ghost" id="find">Buscar mi turno</button>'));
  var codes=getCodes();
  if(!codes.length)$("list").innerHTML='<p class="hint">Todavía no hay turnos guardados en este celular.</p>';
  codes.forEach(function(c){ready(function(){window.DB.get(c).then(function(t){if(t)$("list")&&$("list").appendChild(card(t))}).catch(function(){})})});
  $("find").onclick=function(){
    var c=$("code").value.trim().toUpperCase();if(c.length<8)return $("err").textContent="Escribí tu código completo.";
    window.DB.get(c).then(function(t){if(!t)return $("err").textContent="No encontramos ese código.";saveCode(c);renderMine()}).catch(function(){$("err").textContent="No se pudo buscar. Probá de nuevo."});
  };
}
function card(t){
  var d=document.createElement("div");d.className="card";
  var left=t.inicio-Date.now(),can=t.estado==="activo"&&left>=86400000,st={activo:"Reservado",cancelado:"Cancelado",cancelado_salon:"Cancelado por el salón"}[t.estado]||t.estado;
  var pro=PROS.filter(function(p){return p.n===t.pro})[0]||PROS[0];
  d.innerHTML='<p><span class="badge'+(t.estado==="activo"?"":" x")+'"></span></p><p><b class="sv"></b></p><p class="when"></p><p class="mny"></p><div class="act"></div>';
  d.querySelector(".badge").textContent=st;d.querySelector(".sv").textContent=t.servicios;
  d.querySelector(".when").textContent=t.pro+" · "+pretty(t.date)+" · "+t.time+" hs";
  d.querySelector(".mny").textContent="Total "+money(t.total)+" · Seña pagada "+money(t.sena)+" · Resto en el local "+money(t.resto);
  var act=d.querySelector(".act");
  if(t.estado==="cancelado_salon"){var m=document.createElement("p");m.className="hint";m.textContent="El salón canceló este turno. Te vamos a devolver la seña.";act.appendChild(m)}
  if(t.estado==="activo"){
    var wa=document.createElement("a");wa.className="cta ghost";wa.target="_blank";wa.rel="noopener";wa.textContent="Hablar por WhatsApp con "+pro.n;
    wa.href="https://wa.me/"+pro.wa+"?text="+encodeURIComponent("Hola! Te escribo por mi turno del "+pretty(t.date)+" a las "+t.time+" hs (código "+t.codigo+").");
    if(can){
      var b=document.createElement("button");b.className="cta";b.textContent="Cancelar turno";var armed=false;
      b.onclick=function(){
        if(!armed){armed=true;b.textContent="Tocá de nuevo para confirmar";return}
        b.disabled=true;b.textContent="Cancelando…";
        window.DB.cancel(t).then(function(){
          d.innerHTML='<p><b>Turno cancelado.</b></p><p class="hint">Avisale a '+pro.n+' por WhatsApp para coordinar la seña.</p>';
          var a2=document.createElement("a");a2.className="cta";a2.target="_blank";a2.rel="noopener";a2.textContent="Avisar a "+pro.n;
          a2.href="https://wa.me/"+pro.wa+"?text="+encodeURIComponent("Hola! Cancelé mi turno del "+pretty(t.date)+" a las "+t.time+" hs (código "+t.codigo+").");d.appendChild(a2);
        }).catch(function(){b.disabled=false;b.textContent="No se pudo cancelar. Reintentar"});
      };
      act.appendChild(b);
    }else{var m2=document.createElement("p");m2.className="hint";m2.style.fontSize="1.05rem";m2.textContent="Ya no se puede cancelar online: falta menos de 1 día para tu turno.";act.appendChild(m2)}
    act.appendChild(wa);
  }
  if(t.estado!=="activo"||left<0){
    var rm=document.createElement("button");rm.className="cta ghost";rm.textContent="Quitar de mi lista";
    rm.onclick=function(){removeCode(t.codigo);d.remove()};act.appendChild(rm);
  }
  return d;
}
function removeCode(c){var l=getCodes().filter(function(x){return x!==c});try{localStorage.setItem("nahal_codes",JSON.stringify(l))}catch(e){}}
function render(){
  $("tb").setAttribute("aria-pressed",S.view!=="mine");$("tm").setAttribute("aria-pressed",S.view==="mine");
  if(S.view==="mine")renderMine();else renderBook();
}
var lbI=0,lbz=false,lbx0=0;
function lbShow(i){lbI=(i+GAL.length)%GAL.length;lbz=false;$("lbs").className="st";$("lbi").src=GAL[lbI];$("lbc").textContent=(lbI+1)+" de "+GAL.length+" · tocá la foto para acercar"}
function lbOpen(i){$("lb").style.display="flex";document.body.style.overflow="hidden";lbShow(i)}
function lbClose(){$("lb").style.display="none";document.body.style.overflow=""}
$("lbx").onclick=lbClose;$("lbp").onclick=function(){lbShow(lbI-1)};$("lbnx").onclick=function(){lbShow(lbI+1)};
$("lbi").onclick=function(){lbz=!lbz;$("lbs").className=lbz?"st z":"st"};
$("lbs").addEventListener("touchstart",function(e){lbx0=e.touches[0].clientX},{passive:true});
$("lbs").addEventListener("touchend",function(e){var d=e.changedTouches[0].clientX-lbx0;if(!lbz&&Math.abs(d)>60)lbShow(lbI+(d<0?1:-1))},{passive:true});
$("tb").onclick=function(){S.view="book";render();window.scrollTo(0,0)};
$("tm").onclick=function(){S.view="mine";render();window.scrollTo(0,0)};
render();
</script>
</body>
