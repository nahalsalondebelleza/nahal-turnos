<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3026">
<title>NAHAL · Reservar turno</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#4a3026;--deep:#2b2421;--card:#5a3b2f;--card2:#724330;--cream:#f4f0e8;--gold:#b99a6b;--mute:#c9bba8;--line:rgba(185,154,107,.35);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 'DM Sans',system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 18px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header svg{width:52px;height:52px;flex:none}
.brand{font-family:'DM Serif Display',Georgia,serif;font-size:1.55rem;letter-spacing:.28em;line-height:1}
header small{display:block;color:var(--gold);letter-spacing:.3em;font-size:.75rem;margin-top:5px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:2rem;line-height:1.1;margin:0 0 6px}
h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.25rem;margin:24px 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.gal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 22px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:90px 90px 14px 14px;border:1px solid var(--gold);padding:4px;background:var(--deep);display:block}
.gal p{grid-column:1/-1;margin:2px 0 0;color:var(--gold);font-size:.85rem;text-align:center}
.back{background:#000;border:1.5px solid var(--cream);color:var(--cream);font:600 1.15rem 'DM Sans',sans-serif;padding:8px 18px;min-height:44px;border-radius:999px;margin-bottom:16px;cursor:pointer}
.crumb{color:var(--gold);font-size:1rem;margin:0 0 6px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.opt b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.15rem;display:block}
.opt span.d{display:block;color:var(--mute);font-size:1rem}
.opt .pr{color:var(--gold);font-weight:600;white-space:nowrap}
.opt.arrow:after{content:"›";color:var(--gold);font-size:1.5rem;line-height:1}
.opt:hover{background:var(--card2)}
.opt[aria-pressed=true]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.opt[aria-pressed=true] .pr,.opt[aria-pressed=true] span.d{color:var(--deep)}
.pro{align-items:flex-start;flex-direction:column;gap:8px}
.pro .av{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none}
.pro .row{display:flex;gap:12px;align-items:center}
.pro a{color:var(--gold);font-size:1rem}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 auto;width:62px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;text-align:center;cursor:pointer}
.day small{display:block;color:var(--mute)}
.day strong{font-size:1.25rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;cursor:pointer}
.day[aria-pressed=true],.slot[aria-pressed=true]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.day[aria-pressed=true] small{color:var(--deep)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
input,textarea{width:100%;font:inherit;color:var(--cream);background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cta{width:100%;margin-top:10px;padding:15px;border:0;border-radius:999px;background:var(--gold);color:var(--deep);font:600 1rem 'DM Sans',sans-serif;display:block;text-align:center;text-decoration:none;cursor:pointer}
.cta.ghost{background:none;border:1px solid var(--gold);color:var(--gold)}
.sum{background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:16px;margin:8px 0 14px}
.sum p{margin:4px 0}
.tot{display:flex;justify-content:space-between;font-weight:600;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hint{color:var(--mute);font-size:1rem}
.err{color:#ffb4a0;font-size:1rem;min-height:1.2em;margin:0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay .opt{justify-content:center;text-align:center}
.alias{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--deep);border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;margin:10px 0}
.alias button{background:var(--gold);color:var(--deep);border:0;border-radius:999px;padding:6px 14px;font:600 1rem 'DM Sans',sans-serif;cursor:pointer}
#prev{max-width:100%;max-height:220px;border-radius:12px;margin-top:8px;display:none}
</style>
</head>

<script type="module">
var c = window.FIREBASE_CONFIG;
if (c && c.projectId) {
  try {
    var A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    var F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    var db = F.getFirestore(A.initializeApp(c));
    window.DB = {
      busy: async function(date, pro){
        var q = F.query(F.collection(db,"ocupados"), F.where("date","==",date), F.where("pro","==",pro));
        var snap = await F.getDocs(q); return snap.docs.map(function(d){return d.data()});
      },
      book: async function(b){
        var id = b.date+"_"+b.pro+"_"+b.time, batch = F.writeBatch(db);
        batch.set(F.doc(db,"ocupados",id), {date:b.date, pro:b.pro, time:b.time});
        batch.set(F.doc(db,"turnos",id), {date:b.date, pro:b.pro, time:b.time, servicio:b.svc, total:b.total, minutos:b.min,
          cliente:b.name, telefono:b.tel, aclaraciones:b.note, pago:b.pay, creado:F.serverTimestamp()});
        await batch.commit();
      }
    };
  } catch(e) { console.error("Firebase no se pudo iniciar", e); }
}
window.DB_READY = true;
</script>

function names(){return S.sel.map(function(o){return o.l}).join(", ")}

function priceTxt(o){return o.p==null?"Consultar":money(o.p)}
function go(step){S.step=step;render();window.scrollTo(0,0)}
function back(){
  if(S.step==="tree"&&S.path.length)S.path.pop();

}

    $("nx").onclick=function(){if(!S.date||!S.time)return $("err").textContent="Elegí un día y un horario.";go("final")};
  }else if(S.step==="final"){
    $app.appendChild(el(backBtn()+'<h1>Confirmá tu turno</h1><div class="sum">'+S.sel.map(function(o){return '<p>'+o.l+' <span style="float:right;color:var(--gold)">'+priceTxt(o)+'</span></p>'}).join("")+'<p class="hint">'+S.pro.n+' · '+pretty(S.date)+' · '+S.time+' hs · ~'+minutes()+' min</p><div class="tot"><span>Total</span><span>'+money(total())+'</span></div></div>'+
    '<h2>Tus datos</h2><input id="name" placeholder="Nombre y apellido" autocomplete="name"><input id="tel" placeholder="Teléfono / WhatsApp" type="tel" autocomplete="tel"><textarea id="note" placeholder="¿Querés aclarar algo del turno? (opcional)"></textarea>'+
    '<h2>Forma de pago</h2><div class="pay"><button class="opt" id="p1">Transferencia</button><button class="opt" id="p2">Efectivo</button></div><div id="payBox"></div><p class="err" id="err" role="alert"></p><button class="cta" id="go">Reservar turno</button>'));
    $("p1").onclick=function(){S.pay="Transferencia";drawPay()};$("p2").onclick=function(){S.pay="Efectivo";drawPay()};
    drawPay();$("go").onclick=confirmar;
  }else{
    $app.appendChild(el('<h1>¡Casi listo!</h1><p class="sub">Tocá el botón y enviá el mensaje por WhatsApp a '+S.pro.n+' para que reciba tu turno.</p><div class="sum"><p><b>'+names()+'</b></p><p>'+S.pro.n+' · '+pretty(S.date)+' · '+S.time+' hs</p><div class="tot"><span>Total</span><span>'+money(total())+'</span></div></div><a class="cta" id="wa" target="_blank" rel="noopener">Enviar turno por WhatsApp</a><button class="cta ghost" id="shr" hidden>Enviar comprobante de transferencia</button><button class="back" id="again" style="margin-top:18px">Reservar otro turno</button>'));
    $("wa").href="https://wa.me/"+S.pro.wa+"?text="+encodeURIComponent(S.msg);
    if(S.file&&navigator.canShare&&navigator.canShare({files:[S.file]})){$("shr").hidden=false;
      $("shr").onclick=function(){navigator.share({files:[S.file],text:"Comprobante de transferencia - turno NAHAL"}).catch(function(){})}}
    else if(S.file){var h=document.createElement("p");h.className="hint";h.textContent="Adjuntá el comprobante en el chat de WhatsApp después de enviar el mensaje.";$app.insertBefore(h,$("again"))}
    $("again").onclick=function(){S={path:[],step:"tree",sel:[],pro:null,date:null,time:null,pay:null,file:null};render()};
  }
  var bk=$("bk");if(bk)bk.onclick=back;
}
function drawPay(){
  $("p1").setAttribute("aria-pressed",S.pay==="Transferencia");$("p2").setAttribute("aria-pressed",S.pay==="Efectivo");
  var b=$("payBox");
  if(S.pay==="Transferencia"){
    b.innerHTML='<p class="hint" style="margin-top:12px">Transferí '+money(total())+' al alias de Mercado Pago y subí el comprobante.</p><div class="alias"><b>'+ALIAS+'</b><button id="cp">Copiar</button></div><input type="file" id="file" accept="image/*"><img id="prev" alt="Comprobante">';
    $("cp").onclick=function(){try{navigator.clipboard.writeText(ALIAS);$("cp").textContent="Copiado"}catch(e){$("cp").textContent=ALIAS}};
    $("file").onchange=function(){S.file=this.files[0]||null;if(S.file){$("prev").src=URL.createObjectURL(S.file);$("prev").style.display="block"}};
    if(S.file){$("prev").src=URL.createObjectURL(S.file);$("prev").style.display="block"}
  }else if(S.pay==="Efectivo")b.innerHTML='<p class="hint" style="margin-top:12px">Abonás en efectivo el día del turno.</p>';
  else b.innerHTML="";
}
function drawDays(){
  var box=$("days"),d=new Date(),n=0;
  for(var i=0;i<=MAXDAYS;i++){
    if(HOURS[d.getDay()]){(function(dd){
      var k=iso(dd),b=document.createElement("button");b.className="day";b.setAttribute("aria-pressed",S.date===k);
      b.innerHTML='<small>'+DAYN[dd.getDay()].slice(0,3)+'</small><strong>'+dd.getDate()+'</strong><small>'+MONTHN[dd.getMonth()].slice(0,3)+'</small>';
      b.onclick=function(){S.date=k;S.time=null;S.busy=null;drawDays();drawSlots();loadBusy(k)};box.appendChild(b)})(new Date(d))}
    d.setDate(d.getDate()+1);
  }
  var sel=box.querySelector("[aria-pressed=true]");
}
function drawDaysKeep(){var s=$("days").scrollLeft;$("days").innerHTML="";drawDays();$("days").scrollLeft=s}
function drawSlots(){
  var box=$("slots"),hint=$("sh");box.innerHTML="";
  if(!S.date){hint.textContent="Elegí un día para ver los horarios.";return}
  var p=S.date.split("-"),dow=new Date(+p[0],+p[1]-1,+p[2]).getDay(),hs=HOURS[dow]||[];
  if(S.busy===null||S.busy===undefined){hint.textContent="Cargando horarios…";return}
  var taken=S.busy;
  var now=new Date(),isToday=S.date===iso(now),any=false;
  hs.forEach(function(h){
    var t=String(h).padStart(2,"0")+":00";
    var busy=taken.some(function(x){return x.time===t}),past=isToday&&h*60<=now.getHours()*60+now.getMinutes();
    var b=document.createElement("button");b.className="slot";b.textContent=t+" hs";b.disabled=busy||past;if(!b.disabled)any=true;
    b.setAttribute("aria-pressed",S.time===t);
    b.onclick=function(){S.time=t;drawSlots()};box.appendChild(b);
  });
  hint.textContent=any?"":"No quedan horarios ese día. Probá con otro.";
}
// evitar que el scroll de días se reinicie
var _dd=drawDays;drawDays=function(){var c=$("days"),s=c.scrollLeft;c.innerHTML="";_dd();c.scrollLeft=s};
function loadBusy(k){
  var go2=function(){window.DB.busy(k,S.pro.n).then(function(r){if(S.date===k){S.busy=r;drawSlots()}}).catch(function(){if(S.date===k){S.busy=[];drawSlots()}})};
  if(window.DB_READY)go2();else setTimeout(function(){loadBusy(k)},300);
}
function confirmar(){
  var name=$("name").value.trim(),tel=$("tel").value.trim(),note=$("note").value.trim(),err=$("err");
  if(name.length<2)return err.textContent="Escribí tu nombre.";
  if(tel.replace(/\D/g,"").length<6)return err.textContent="Escribí un teléfono válido.";
  if(!S.pay)return err.textContent="Elegí transferencia o efectivo.";
  if(S.pay==="Transferencia"&&!S.file)return err.textContent="Subí el comprobante de la transferencia.";
  
  S.msg="*NUEVO TURNO · NAHAL*\n\n*Servicio:* "+names()+"\n*Profesional:* "+S.pro.n+"\n*Fecha:* "+pretty(S.date)+"\n*Horario:* "+S.time+" hs\n*Duración estimada:* "+minutes()+" min\n*Total:* "+money(total())+(S.sel.some(function(o){return o.p==null})?" (+ servicio a consultar)":"")+"\n*Pago:* "+S.pay+(S.pay==="Transferencia"?" (alias "+ALIAS+", comprobante adjunto)":"")+"\n\n*Cliente:* "+name+"\n*Teléfono:* "+tel+(note?"\n*Aclaraciones:* "+note:"");
  var btn=$("go");btn.disabled=true;btn.textContent="Reservando…";err.textContent="";
  window.DB.book({date:S.date,time:S.time,pro:S.pro.n,svc:names(),total:total(),min:minutes(),name:name,tel:tel,note:note,pay:S.pay})
   .then(function(){go("done")})
   .catch(function(){S.busy=null;S.time=null;go("when");loadBusy(S.date);setTimeout(function(){var e=$("err");if(e)e.textContent="Ese horario se acaba de ocupar. Elegí otro."},50)});
}
render();
</script>
</body>
</html>
